<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Effects — Live Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
        padding: 40px;
        line-height: 1.6;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 60px;
      }
      .demo {
        background: #111;
        padding: 40px;
        margin: 40px 0;
        border-radius: 16px;
        border: 1px solid #333;
      }
      .effect {
        font-size: 3.2rem;
        font-weight: 700;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 20px 0;
        text-align: center;
      }
      button {
        padding: 12px 28px;
        font-size: 1.1rem;
        margin: 8px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Apex Library — Text Effects Demo</h1>

      <div class="demo">
        <h2>YugopScramble</h2>
        <div id="yugop" class="effect">Hello World</div>
        <button onclick="runYugop()">Run YugopScramble</button>
      </div>

      <div class="demo">
        <h2>KPRScramble</h2>
        <div id="kpr" class="effect">Fast Scramble</div>
        <button onclick="runKPR()">Run KPRScramble</button>
      </div>

      <div class="demo">
        <h2>WriterScramble</h2>
        <div id="writer" class="effect">Typing Effect</div>
        <button onclick="runWriter()">Run WriterScramble</button>
      </div>
    </div>

    <script type="module">
      import { YugopScramble } from '../dist/String/Effects/YugopScramble.js';
      import { KPRScramble } from '../dist/String/Effects/KPRScramble.js';
      import { WriterScramble } from '../dist/String/Effects/WriterScramble.js';

      let yugop, kpr, writer;

      window.runYugop = () => {
        if (!yugop) yugop = new YugopScramble(document.getElementById('yugop'));
        yugop.init();
      };

      window.runKPR = () => {
        if (!kpr) kpr = new KPRScramble(document.getElementById('kpr'));
        kpr.init();
      };

      window.runWriter = () => {
        if (!writer) writer = new WriterScramble(document.getElementById('writer'));
        writer.init();
      };
    </script>
  </body>
</html>
