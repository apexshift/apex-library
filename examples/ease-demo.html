<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Ease — Live Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
        padding: 40px;
        line-height: 1.6;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 40px;
      }
      .demo {
        background: #111;
        padding: 30px;
        margin: 30px 0;
        border-radius: 12px;
        border: 1px solid #333;
      }
      .demo h2 {
        margin-top: 0;
        color: #4ade80;
      }
      .controls {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .control-group label {
        font-size: 14px;
        color: #ccc;
      }
      select,
      input[type='text'] {
        padding: 8px 12px;
        background: #222;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
        font-size: 14px;
      }
      select:focus,
      input[type='text']:focus {
        outline: none;
        border-color: #4ade80;
      }
      .preset-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      button {
        padding: 8px 16px;
        margin: 2px;
        background: #333;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      button:hover {
        background: #444;
      }
      button.active {
        background: #4ade80;
        color: #000;
        border-color: #4ade80;
      }
      .animation-section {
        background: #000;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
        position: relative;
        overflow: hidden;
      }
      .animated-box {
        width: 50px;
        height: 50px;
        background: linear-gradient(45deg, #4ade80, #22c55e);
        border-radius: 8px;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        transition: none;
        box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
      }
      .progress-bar {
        height: 4px;
        background: #333;
        border-radius: 2px;
        margin: 20px 0;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: #4ade80;
        width: 0%;
        transition: width 0.1s ease;
      }
      .curve-canvas {
        background: #000;
        border-radius: 8px;
        margin: 20px 0;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 300px;
        border-radius: 8px;
      }
      .info {
        background: #222;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        font-family: monospace;
        font-size: 14px;
      }
      .easing-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin: 20px 0;
      }
      .easing-item {
        background: #222;
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid transparent;
      }
      .easing-item:hover {
        background: #333;
      }
      .easing-item.active {
        border-color: #4ade80;
        background: #333;
      }
      .easing-name {
        font-weight: bold;
        margin-bottom: 5px;
        color: #4ade80;
      }
      .easing-preview {
        height: 40px;
        background: #000;
        border-radius: 4px;
        position: relative;
        overflow: hidden;
      }
      .preview-bar {
        height: 100%;
        background: #4ade80;
        width: 0%;
        transition: width 0.3s ease;
      }
      .error {
        color: #ef4444;
        background: #1f1f1f;
        padding: 10px;
        border-radius: 6px;
        margin: 10px 0;
        border: 1px solid #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Apex Ease Demo</h1>

      <div class="demo">
        <h2>Easing Function Explorer</h2>
        <p>Select an easing function or enter a custom cubic-bezier string to see it in action.</p>

        <div class="controls">
          <div class="control-group">
            <label>Easing Function</label>
            <select id="easing-select">
              <option value="">Select easing...</option>
              <optgroup label="Power">
                <option value="inQuad">inQuad</option>
                <option value="outQuad">outQuad</option>
                <option value="inOutQuad">inOutQuad</option>
                <option value="inCubic">inCubic</option>
                <option value="outCubic">outCubic</option>
                <option value="inOutCubic">inOutCubic</option>
                <option value="inQuart">inQuart</option>
                <option value="outQuart">outQuart</option>
                <option value="inOutQuart">inOutQuart</option>
                <option value="inQuint">inQuint</option>
                <option value="outQuint">outQuint</option>
                <option value="inOutQuint">inOutQuint</option>
              </optgroup>
              <optgroup label="Trigonometric">
                <option value="inSine">inSine</option>
                <option value="outSine">outSine</option>
                <option value="inOutSine">inOutSine</option>
              </optgroup>
              <optgroup label="Exponential">
                <option value="inExpo">inExpo</option>
                <option value="outExpo">outExpo</option>
                <option value="inOutExpo">inOutExpo</option>
              </optgroup>
              <optgroup label="Circular">
                <option value="inCirc">inCirc</option>
                <option value="outCirc">outCirc</option>
                <option value="inOutCirc">inOutCirc</option>
              </optgroup>
              <optgroup label="Back">
                <option value="inBack">inBack</option>
                <option value="outBack">outBack</option>
                <option value="inOutBack">inOutBack</option>
              </optgroup>
              <optgroup label="Elastic">
                <option value="inElastic">inElastic</option>
                <option value="outElastic">outElastic</option>
                <option value="inOutElastic">inOutElastic</option>
              </optgroup>
              <optgroup label="Bounce">
                <option value="inBounce">inBounce</option>
                <option value="outBounce">outBounce</option>
                <option value="inOutBounce">inOutBounce</option>
              </optgroup>
            </select>
          </div>

          <div class="control-group">
            <label>Custom Bezier</label>
            <input type="text" id="bezier-input" placeholder="cubic-bezier(0.25, 0.1, 0.25, 1)" />
          </div>

          <button id="play-animation">Play Animation</button>
          <button id="reset-animation">Reset</button>
        </div>

        <div id="error-message" class="error" style="display: none"></div>

        <div class="animation-section">
          <div class="animated-box" id="animated-box"></div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="curve-canvas">
          <canvas id="curve-canvas" width="800" height="300"></canvas>
        </div>

        <div class="info">
          <div>Current: <span id="current-easing">Linear</span></div>
          <div>Sample at t=0.5: <span id="sample-value">0.500</span></div>
        </div>
      </div>

      <div class="demo">
        <h2>Easing Gallery</h2>
        <p>Click any easing function below to preview it.</p>

        <div class="easing-grid" id="easing-grid">
          <!-- Easing items will be populated by JavaScript -->
        </div>
      </div>
    </div>

    <script type="module">
      import { Ease } from '../dist/Math/Ease.js';
      import { CubicBezier } from '../dist/Math/CubicBezier.js';

      class EaseDemo {
        constructor() {
          this.currentEasing = (t) => t;
          this.currentEasingName = 'Linear';
          this.animationRunning = false;
          this.animationStart = null;

          this.setupControls();
          this.setupCanvas();
          this.setupAnimation();
          this.createEasingGallery();
          this.updateDisplay();
        }

        setupControls() {
          // Easing select
          document.getElementById('easing-select').addEventListener('change', (e) => {
            const easingName = e.target.value;
            if (easingName) {
              this.setEasing(easingName);
            }
          });

          // Bezier input
          document.getElementById('bezier-input').addEventListener('input', (e) => {
            const bezierStr = e.target.value.trim();
            if (bezierStr) {
              this.setEasing(bezierStr);
            } else {
              this.setEasing('Linear');
            }
          });

          // Animation controls
          document.getElementById('play-animation').addEventListener('click', () => {
            this.startAnimation();
          });

          document.getElementById('reset-animation').addEventListener('click', () => {
            this.resetAnimation();
          });
        }

        setupCanvas() {
          this.canvas = document.getElementById('curve-canvas');
          this.ctx = this.canvas.getContext('2d');
          this.resizeCanvas();
          window.addEventListener('resize', () => this.resizeCanvas());
        }

        resizeCanvas() {
          const rect = this.canvas.getBoundingClientRect();
          this.canvas.width = rect.width * window.devicePixelRatio;
          this.canvas.height = rect.height * window.devicePixelRatio;
          this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
          this.drawCurve();
        }

        setupAnimation() {
          // Animation setup is handled in startAnimation/resetAnimation
        }

        setEasing(easingNameOrBezier) {
          try {
            const easingFn = Ease.resolve(easingNameOrBezier);
            if (easingFn) {
              this.currentEasing = easingFn;
              this.currentEasingName = easingNameOrBezier;
              this.updateDisplay();
              this.drawCurve();
              this.hideError();
            } else {
              throw new Error('Invalid easing function');
            }
          } catch (error) {
            this.showError(`Invalid easing: ${easingNameOrBezier}`);
            this.setEasing('Linear');
          }
        }

        updateDisplay() {
          document.getElementById('current-easing').textContent = this.currentEasingName;
          document.getElementById('sample-value').textContent = this.currentEasing(0.5).toFixed(3);
        }

        drawCurve() {
          const width = this.canvas.offsetWidth;
          const height = this.canvas.offsetHeight;

          this.ctx.clearRect(0, 0, width, height);

          // Draw grid
          this.ctx.strokeStyle = '#333';
          this.ctx.lineWidth = 1;
          for (let i = 0; i <= 10; i++) {
            const x = (i / 10) * width;
            const y = (i / 10) * height;

            this.ctx.beginPath();
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, height);
            this.ctx.stroke();

            this.ctx.beginPath();
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(width, y);
            this.ctx.stroke();
          }

          // Draw curve
          this.ctx.strokeStyle = '#4ade80';
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();

          for (let t = 0; t <= 1; t += 0.005) {
            const x = t * width;
            const y = (1 - this.currentEasing(t)) * height;

            if (t === 0) {
              this.ctx.moveTo(x, y);
            } else {
              this.ctx.lineTo(x, y);
            }
          }
          this.ctx.stroke();

          // Draw axes labels
          this.ctx.fillStyle = '#666';
          this.ctx.font = '12px monospace';
          this.ctx.fillText('0', 5, height - 5);
          this.ctx.fillText('1', width - 15, height - 5);
          this.ctx.fillText('1', 5, 15);
          this.ctx.fillText('t', width - 15, height - 5);
          this.ctx.fillText('y', 5, 15);
        }

        startAnimation() {
          if (this.animationRunning) return;

          this.animationRunning = true;
          this.animationStart = performance.now();
          this.animate();
        }

        resetAnimation() {
          this.animationRunning = false;
          this.animationStart = null;
          this.updateAnimationDisplay(0);
        }

        animate() {
          if (!this.animationRunning) return;

          const elapsed = performance.now() - this.animationStart;
          const duration = 2000; // 2 seconds
          const t = Math.min(elapsed / duration, 1);

          this.updateAnimationDisplay(t);

          if (t < 1) {
            requestAnimationFrame(() => this.animate());
          } else {
            this.animationRunning = false;
          }
        }

        updateAnimationDisplay(t) {
          const progress = t * 100;
          const easedValue = this.currentEasing(t);

          document.getElementById('progress-fill').style.width = `${progress}%`;
          document.getElementById('animated-box').style.left = `${easedValue * 100}%`;
        }

        createEasingGallery() {
          const grid = document.getElementById('easing-grid');
          const easings = [
            'Linear',
            'inQuad',
            'outQuad',
            'inOutQuad',
            'inCubic',
            'outCubic',
            'inOutCubic',
            'inSine',
            'outSine',
            'inOutSine',
            'inExpo',
            'outExpo',
            'inOutExpo',
            'inCirc',
            'outCirc',
            'inOutCirc',
            'inBack',
            'outBack',
            'inOutBack',
            'inElastic',
            'outElastic',
            'inOutElastic',
            'inBounce',
            'outBounce',
            'inOutBounce',
          ];

          easings.forEach((easingName) => {
            const item = document.createElement('div');
            item.className = 'easing-item';
            item.onclick = () => {
              document
                .querySelectorAll('.easing-item')
                .forEach((el) => el.classList.remove('active'));
              item.classList.add('active');
              this.setEasing(easingName);
              document.getElementById('easing-select').value = easingName;
              document.getElementById('bezier-input').value = '';
            };

            const name = document.createElement('div');
            name.className = 'easing-name';
            name.textContent = easingName;

            const preview = document.createElement('div');
            preview.className = 'easing-preview';

            const bar = document.createElement('div');
            bar.className = 'preview-bar';
            preview.appendChild(bar);

            item.appendChild(name);
            item.appendChild(preview);
            grid.appendChild(item);

            // Animate preview
            setTimeout(() => {
              const easingFn = Ease.getEasing(easingName);
              bar.style.width = `${easingFn(0.7) * 100}%`;
            }, 100);
          });
        }

        showError(message) {
          const errorEl = document.getElementById('error-message');
          errorEl.textContent = message;
          errorEl.style.display = 'block';
        }

        hideError() {
          document.getElementById('error-message').style.display = 'none';
        }
      }

      // Initialize demo
      new EaseDemo();
    </script>
  </body>
</html>
