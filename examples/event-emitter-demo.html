<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex EventEmitter — Live Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
        padding: 40px;
        line-height: 1.6;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 40px;
      }
      .demo {
        background: #111;
        padding: 30px;
        margin: 30px 0;
        border-radius: 12px;
        border: 1px solid #333;
      }
      .demo h2 {
        margin-top: 0;
        color: #4ade80;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        background: #4ade80;
        color: #000;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #22c55e;
      }
      .output {
        background: #000;
        padding: 15px;
        border-radius: 6px;
        margin-top: 15px;
        font-family: monospace;
        white-space: pre-wrap;
      }
      .section {
        margin-bottom: 40px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Apex EventEmitter Demo</h1>

      <div class="demo section">
        <h2>Basic Event Emission</h2>
        <p>Click to emit events and see listeners respond.</p>
        <button id="emit-basic">Emit 'click' Event</button>
        <button id="emit-data">Emit 'data' with Payload</button>
        <div class="output" id="basic-output"></div>
      </div>

      <div class="demo section">
        <h2>Once vs On</h2>
        <p>'once' listeners fire only once, 'on' listeners fire every time.</p>
        <button id="emit-once-test">Emit 'test' Event</button>
        <div class="output" id="once-output"></div>
      </div>

      <div class="demo section">
        <h2>Error Handling</h2>
        <p>EventEmitter handles callback errors gracefully.</p>
        <button id="emit-error">Emit with Erroring Listener</button>
        <div class="output" id="error-output"></div>
      </div>

      <div class="demo section">
        <h2>Unsubscribe</h2>
        <p>Remove listeners dynamically.</p>
        <button id="emit-unsub">Emit 'unsub-test'</button>
        <button id="unsubscribe">Unsubscribe First Listener</button>
        <div class="output" id="unsub-output"></div>
      </div>
    </div>

    <script type="module">
      import { EventEmitter } from '../dist/Event/EventEmitter.js';

      const emitter = new EventEmitter();

      // Basic demo
      const basicOutput = document.getElementById('basic-output');
      emitter.on('click', (payload) => {
        basicOutput.textContent += `Basic listener: ${payload || 'no payload'}\n`;
      });

      emitter.on('data', (payload) => {
        basicOutput.textContent += `Data listener: ${JSON.stringify(payload)}\n`;
      });

      document.getElementById('emit-basic').addEventListener('click', () => {
        emitter.emit('click');
      });

      document.getElementById('emit-data').addEventListener('click', () => {
        emitter.emit('data', { message: 'Hello from EventEmitter!', timestamp: Date.now() });
      });

      // Once vs On demo
      const onceOutput = document.getElementById('once-output');
      let onCount = 0;
      let onceCount = 0;

      emitter.on('test', () => {
        onCount++;
        onceOutput.textContent = `On listener fired ${onCount} times\nOnce listener fired ${onceCount} times\n`;
      });

      emitter.once('test', () => {
        onceCount++;
        onceOutput.textContent = `On listener fired ${onCount} times\nOnce listener fired ${onceCount} times\n`;
      });

      document.getElementById('emit-once-test').addEventListener('click', () => {
        emitter.emit('test');
      });

      // Error handling demo
      const errorOutput = document.getElementById('error-output');
      emitter.on('error-test', () => {
        throw new Error('Intentional error in listener');
      });

      emitter.on('error-test', () => {
        errorOutput.textContent += 'Good listener still ran!\n';
      });

      document.getElementById('emit-error').addEventListener('click', () => {
        emitter.emit('error-test');
        errorOutput.textContent += 'Error handled gracefully\n';
      });

      // Unsubscribe demo
      const unsubOutput = document.getElementById('unsub-output');
      let unsubCount = 0;

      const listener1 = () => {
        unsubCount++;
        unsubOutput.textContent += `Listener 1 fired (${unsubCount})\n`;
      };

      const listener2 = () => {
        unsubOutput.textContent += 'Listener 2 fired\n';
      };

      emitter.on('unsub-test', listener1);
      emitter.on('unsub-test', listener2);

      document.getElementById('emit-unsub').addEventListener('click', () => {
        emitter.emit('unsub-test');
      });

      document.getElementById('unsubscribe').addEventListener('click', () => {
        emitter.off('unsub-test', listener1);
        unsubOutput.textContent += 'Listener 1 unsubscribed\n';
      });
    </script>
  </body>
</html>
