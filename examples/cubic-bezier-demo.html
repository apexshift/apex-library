<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex CubicBezier — Live Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
        padding: 40px;
        line-height: 1.6;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        margin-bottom: 40px;
      }
      .demo {
        background: #111;
        padding: 30px;
        margin: 30px 0;
        border-radius: 12px;
        border: 1px solid #333;
      }
      .demo h2 {
        margin-top: 0;
        color: #4ade80;
      }
      .controls {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .control-group label {
        font-size: 14px;
        color: #ccc;
      }
      input[type='range'] {
        width: 150px;
      }
      .preset-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 16px;
        margin: 2px;
        background: #4ade80;
        color: #000;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #22c55e;
      }
      button.active {
        background: #16a34a;
      }
      .canvas-container {
        position: relative;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        margin: 20px 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 400px;
      }
      .animation-demo {
        background: #000;
        border-radius: 8px;
        padding: 20px;
        margin: 20px 0;
        position: relative;
        overflow: hidden;
      }
      .animated-box {
        width: 50px;
        height: 50px;
        background: #4ade80;
        border-radius: 8px;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        transition: none;
      }
      .progress-bar {
        height: 4px;
        background: #333;
        border-radius: 2px;
        margin: 20px 0;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: #4ade80;
        width: 0%;
        transition: width 0.1s ease;
      }
      .info {
        background: #222;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        font-family: monospace;
        font-size: 14px;
      }
      .point {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #4ade80;
        border: 2px solid #fff;
        border-radius: 50%;
        cursor: move;
        transform: translate(-50%, -50%);
      }
      .point.control {
        background: #f59e0b;
      }
      .curve-line {
        stroke: #4ade80;
        stroke-width: 2;
        fill: none;
      }
      .control-line {
        stroke: #666;
        stroke-width: 1;
        stroke-dasharray: 5, 5;
        fill: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Apex CubicBezier Demo</h1>

      <div class="demo">
        <h2>Interactive Bezier Curve</h2>
        <p>
          Drag the control points to modify the curve. Watch the animation below update in
          real-time.
        </p>

        <div class="controls">
          <div class="control-group">
            <label>P1 X: <span id="p1x-value">0.25</span></label>
            <input type="range" id="p1x" min="0" max="1" step="0.01" value="0.25" />
          </div>
          <div class="control-group">
            <label>P1 Y: <span id="p1y-value">0.10</span></label>
            <input type="range" id="p1y" min="0" max="1" step="0.01" value="0.10" />
          </div>
          <div class="control-group">
            <label>P2 X: <span id="p2x-value">0.25</span></label>
            <input type="range" id="p2x" min="0" max="1" step="0.01" value="0.25" />
          </div>
          <div class="control-group">
            <label>P2 Y: <span id="p2y-value">1.00</span></label>
            <input type="range" id="p2y" min="0" max="1" step="0.01" value="1.00" />
          </div>
        </div>

        <div class="preset-buttons">
          <button class="preset active" data-preset="ease">Ease</button>
          <button class="preset" data-preset="ease-in">Ease In</button>
          <button class="preset" data-preset="ease-out">Ease Out</button>
          <button class="preset" data-preset="ease-in-out">Ease In Out</button>
          <button class="preset" data-preset="linear">Linear</button>
          <button class="preset" data-preset="bounce">Bounce</button>
        </div>

        <div class="canvas-container">
          <canvas id="bezier-canvas" width="800" height="400"></canvas>
        </div>

        <div class="info">
          <div>Current: cubic-bezier(<span id="current-values">0.25, 0.1, 0.25, 1</span>)</div>
          <div>Sample at t=0.5: <span id="sample-value">0.311</span></div>
        </div>
      </div>

      <div class="demo">
        <h2>Animation Demo</h2>
        <p>The box below animates using the current Bezier curve.</p>

        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="animation-demo">
          <div class="animated-box" id="animated-box"></div>
        </div>

        <button id="play-animation">Play Animation</button>
        <button id="reset-animation">Reset</button>
      </div>
    </div>

    <script type="module">
      import { CubicBezier } from '../dist/Math/CubicBezier.js';

      class BezierDemo {
        constructor() {
          this.canvas = document.getElementById('bezier-canvas');
          this.ctx = this.canvas.getContext('2d');
          this.bezier = new CubicBezier(0.25, 0.1, 0.25, 1.0);

          this.presets = {
            ease: [0.25, 0.1, 0.25, 1.0],
            'ease-in': [0.42, 0, 1, 1],
            'ease-out': [0, 0, 0.58, 1],
            'ease-in-out': [0.42, 0, 0.58, 1],
            linear: [0.25, 0.25, 0.75, 0.75],
            bounce: [0.68, -0.55, 0.265, 1.55],
          };

          this.setupControls();
          this.setupCanvas();
          this.updateDisplay();
          this.setupAnimation();
        }

        setupControls() {
          // Sliders
          ['p1x', 'p1y', 'p2x', 'p2y'].forEach((id) => {
            const input = document.getElementById(id);
            const valueSpan = document.getElementById(`${id}-value`);

            input.addEventListener('input', (e) => {
              const value = parseFloat(e.target.value);
              valueSpan.textContent = value.toFixed(2);
              this.updateBezier();
            });
          });

          // Presets
          document.querySelectorAll('.preset').forEach((btn) => {
            btn.addEventListener('click', () => {
              document.querySelectorAll('.preset').forEach((b) => b.classList.remove('active'));
              btn.classList.add('active');

              const preset = this.presets[btn.dataset.preset];
              this.setControlPoints(...preset);
            });
          });
        }

        setupCanvas() {
          this.resizeCanvas();
          window.addEventListener('resize', () => this.resizeCanvas());

          // Make canvas interactive
          this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
          this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
          this.canvas.addEventListener('mouseup', () => this.handleMouseUp());
        }

        resizeCanvas() {
          const rect = this.canvas.getBoundingClientRect();
          this.canvas.width = rect.width * window.devicePixelRatio;
          this.canvas.height = rect.height * window.devicePixelRatio;
          this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
          this.draw();
        }

        handleMouseDown(e) {
          const rect = this.canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = 1 - (e.clientY - rect.top) / rect.height;

          // Check if clicking near control points
          const points = this.getControlPoints();
          this.dragging = null;

          for (let i = 0; i < points.length; i++) {
            const dx = points[i].x - x;
            const dy = points[i].y - y;
            if (Math.sqrt(dx * dx + dy * dy) < 0.05) {
              this.dragging = i;
              break;
            }
          }
        }

        handleMouseMove(e) {
          if (this.dragging === null) return;

          const rect = this.canvas.getBoundingClientRect();
          const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          const y = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));

          const points = ['p1x', 'p1y', 'p2x', 'p2y'];
          const input = document.getElementById(points[this.dragging]);
          const valueSpan = document.getElementById(`${points[this.dragging]}-value`);

          input.value = y; // Note: y is inverted in our coordinate system
          valueSpan.textContent = y.toFixed(2);

          this.updateBezier();
        }

        handleMouseUp() {
          this.dragging = null;
        }

        getControlPoints() {
          return [
            { x: 0, y: 0 },
            {
              x: parseFloat(document.getElementById('p1x').value),
              y: parseFloat(document.getElementById('p1y').value),
            },
            {
              x: parseFloat(document.getElementById('p2x').value),
              y: parseFloat(document.getElementById('p2y').value),
            },
            { x: 1, y: 1 },
          ];
        }

        setControlPoints(p1x, p1y, p2x, p2y) {
          document.getElementById('p1x').value = p1x;
          document.getElementById('p1y').value = p1y;
          document.getElementById('p2x').value = p2x;
          document.getElementById('p2y').value = p2y;

          document.getElementById('p1x-value').textContent = p1x.toFixed(2);
          document.getElementById('p1y-value').textContent = p1y.toFixed(2);
          document.getElementById('p2x-value').textContent = p2x.toFixed(2);
          document.getElementById('p2y-value').textContent = p2y.toFixed(2);

          this.updateBezier();
        }

        updateBezier() {
          const p1x = parseFloat(document.getElementById('p1x').value);
          const p1y = parseFloat(document.getElementById('p1y').value);
          const p2x = parseFloat(document.getElementById('p2x').value);
          const p2y = parseFloat(document.getElementById('p2y').value);

          this.bezier = new CubicBezier(p1x, p1y, p2x, p2y);
          this.updateDisplay();
          this.draw();
        }

        updateDisplay() {
          const p1x = parseFloat(document.getElementById('p1x').value);
          const p1y = parseFloat(document.getElementById('p1y').value);
          const p2x = parseFloat(document.getElementById('p2x').value);
          const p2y = parseFloat(document.getElementById('p2y').value);

          document.getElementById('current-values').textContent =
            `${p1x.toFixed(2)}, ${p1y.toFixed(2)}, ${p2x.toFixed(2)}, ${p2y.toFixed(2)}`;
          document.getElementById('sample-value').textContent = this.bezier.sample(0.5).toFixed(3);
        }

        draw() {
          const rect = this.canvas.getBoundingClientRect();
          const width = rect.width;
          const height = rect.height;

          this.ctx.clearRect(0, 0, width, height);

          // Draw grid
          this.ctx.strokeStyle = '#333';
          this.ctx.lineWidth = 1;
          for (let i = 0; i <= 10; i++) {
            const x = (i / 10) * width;
            const y = (i / 10) * height;

            this.ctx.beginPath();
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, height);
            this.ctx.stroke();

            this.ctx.beginPath();
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(width, y);
            this.ctx.stroke();
          }

          // Draw control lines
          const points = this.getControlPoints();
          this.ctx.strokeStyle = '#666';
          this.ctx.setLineDash([5, 5]);
          this.ctx.lineWidth = 1;

          this.ctx.beginPath();
          this.ctx.moveTo(points[0].x * width, (1 - points[0].y) * height);
          this.ctx.lineTo(points[1].x * width, (1 - points[1].y) * height);
          this.ctx.stroke();

          this.ctx.beginPath();
          this.ctx.moveTo(points[3].x * width, (1 - points[3].y) * height);
          this.ctx.lineTo(points[2].x * width, (1 - points[2].y) * height);
          this.ctx.stroke();

          this.ctx.setLineDash([]);

          // Draw curve
          this.ctx.strokeStyle = '#4ade80';
          this.ctx.lineWidth = 3;
          this.ctx.beginPath();

          for (let t = 0; t <= 1; t += 0.01) {
            const x = t * width;
            const y = (1 - this.bezier.sample(t)) * height;

            if (t === 0) {
              this.ctx.moveTo(x, y);
            } else {
              this.ctx.lineTo(x, y);
            }
          }
          this.ctx.stroke();

          // Draw points
          points.forEach((point, index) => {
            this.ctx.fillStyle = index === 0 || index === 3 ? '#4ade80' : '#f59e0b';
            this.ctx.beginPath();
            this.ctx.arc(point.x * width, (1 - point.y) * height, 6, 0, 2 * Math.PI);
            this.ctx.fill();

            this.ctx.strokeStyle = '#fff';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
          });
        }

        setupAnimation() {
          this.animationRunning = false;
          this.animationStart = null;

          document.getElementById('play-animation').addEventListener('click', () => {
            this.startAnimation();
          });

          document.getElementById('reset-animation').addEventListener('click', () => {
            this.resetAnimation();
          });
        }

        startAnimation() {
          if (this.animationRunning) return;

          this.animationRunning = true;
          this.animationStart = performance.now();
          this.animate();
        }

        resetAnimation() {
          this.animationRunning = false;
          this.animationStart = null;
          this.updateAnimationDisplay(0);
        }

        animate() {
          if (!this.animationRunning) return;

          const elapsed = performance.now() - this.animationStart;
          const duration = 2000; // 2 seconds
          const t = Math.min(elapsed / duration, 1);

          this.updateAnimationDisplay(t);

          if (t < 1) {
            requestAnimationFrame(() => this.animate());
          } else {
            this.animationRunning = false;
          }
        }

        updateAnimationDisplay(t) {
          const progress = t * 100;
          const easedValue = this.bezier.sample(t);

          document.getElementById('progress-fill').style.width = `${progress}%`;
          document.getElementById('animated-box').style.left = `${easedValue * 100}%`;
        }
      }

      // Initialize demo
      new BezierDemo();
    </script>
  </body>
</html>
