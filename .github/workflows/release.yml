name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version PR or Changelog
        uses: changesets/action@v1
        with:
          version: pnpm version          # Only creates version PR / updates changelog
          publish: echo "Skipping publish (private project)"   # Disabled for now
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
