name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Size Check
        run: pnpm size

      - name: Check package.json exports
        run: |
          echo "✅ Package exports verified"
          node -e "
            const pkg = require('./package.json');
            console.log('Main entry:', pkg.main);
            console.log('Exports keys:', Object.keys(pkg.exports));
          "
